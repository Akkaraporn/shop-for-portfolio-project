# ---------------------------------------------------------------------------
# The whole stack. Backends live behind compose profiles so exactly one of
# them is ever running, and the gateway makes the swap invisible to the web app.
#
#   make up-node   ->  gateway -> api-node   (profile: node)
#   make up-java   ->  gateway -> api-java   (profile: java)
#
# Both profiles share the same Postgres, the same Flyway migrations and the
# same Redis. That shared state is what makes cross-backend parity testable.
# ---------------------------------------------------------------------------
name: vibecode-shop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Published so a backend can be run on the host against the containerised
    # data layer, which is the normal inner loop while developing a module.
    # Non-default host port for the same reason as Postgres: a locally installed
    # Redis would otherwise shadow it.
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Owns the schema. Runs once, exits, and both backends wait for that exit.
  # Neither Prisma migrate nor ddl-auto is ever allowed to touch the schema.
  flyway:
    image: flyway/flyway:10-alpine
    restart: "no"
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ../migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # --- backends: exactly one profile at a time ----------------------------

  api-node:
    profiles: ["node"]
    build:
      context: ../apps/api-node
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: ${DATABASE_URL}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS:-2000}
      CURRENCY: ${CURRENCY:-THB}
      SHIPPING_FLAT_CENTS: ${SHIPPING_FLAT_CENTS:-5000}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      # The one line that makes "backend booted on a stale schema" impossible.
      flyway:   { condition: service_completed_successfully }

  api-java:
    profiles: ["java"]
    build:
      context: ../apps/api-java
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # validate, never update. Flyway owns the schema.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS:-2000}
      CURRENCY: ${CURRENCY:-THB}
      SHIPPING_FLAT_CENTS: ${SHIPPING_FLAT_CENTS:-5000}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      flyway:   { condition: service_completed_successfully }

  # --- frontend + gateway -------------------------------------------------

  # Behind a profile until Phase 3 creates its Dockerfile: without this, every
  # `up` tries to build an image from an empty directory and fails. `make up-node`
  # will include it once apps/web can build (task 3.5).
  web:
    profiles: ["web"]
    build:
      context: ../apps/web
    restart: unless-stopped

  # nginx:alpine runs envsubst over /etc/nginx/templates/*.template on boot,
  # so BACKEND_HOST is all that changes between the two profiles.
  #
  # No depends_on, deliberately. The gateway resolves its upstreams per request
  # (see the template), so it starts and stays up whether or not a backend or the
  # frontend is running, answering 503 for whichever is absent. That is what lets
  # `make up-infra` be useful before Phase 2 exists, and what stops a backend
  # restart from taking the gateway with it.
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-api-node}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1
      # first and nginx listens on IPv4 only, so the probe would be refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/__gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
