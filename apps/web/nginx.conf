# Serves the built app. The gateway in front of it owns /api; this server only
# ever sees page and asset requests.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets, so a file there never changes
    # under its name and can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route. Without the fallback, reloading
    # /orders/ORD-2026-0000001 asks nginx for a file that does not exist and 404s.
    # index.html itself is never cached, or a deploy would keep serving the old
    # bundle's hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
